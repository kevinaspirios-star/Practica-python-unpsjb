<html><head><title>Ejercicio1</title>

 <style>
    button{

        background-color: #412aa5;
    }
 </style></head>
 <body>
  <h1>Cambio de Color

  </h1>

  <p> Cambiando el color de fondo usando javaScript</p>

  <button onclick="cambiarColor()" type="button"> Color Favorito</button>

  <script>

    function cambiarColor(){
        const r = Math.floor(Math.random() * 256);
        const g = Math.floor(Math.random() * 256);
        const b = Math.floor(Math.random() * 256);
        document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;

    }

  </script>
 </body>
</html>
